<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Medicare Made Plain cover</title>
<!--
  PLAIN TALK RETIREMENT SERIES - shared cover system (Walt Brennan).
  Deliberately NOT the Family Paperwork look: ivory ground instead of forest, a dark
  footer slab instead of twin accent bands, a knockout title bar instead of a sans tail.
  To make a sibling book, copy this file and change only --accent plus the text.
    Book 1  medicare-2027        --accent #b1392b  brick
    Book 2  social-security-2027 --accent reserved
  Rules: 1600x2560 canvas, system fonts only, no external URLs, every text element keeps data-text.
-->
<style>
:root{
  --accent:#b1392b;
  --ink:#0f3242;
  --ink2:#0b2733;
  --paper:#f4eee2;
  --paper2:#e9e0ce;
  --cream:#fbf7ef;
  --soft:#a9c6d2;
  --edge:#9aa2a6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:2560px;overflow:hidden}
body{
  background:
    radial-gradient(1400px 1000px at 50% 30%, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 70%),
    linear-gradient(168deg, var(--paper) 0%, var(--paper) 58%, var(--paper2) 100%);
  color:var(--ink);
  font-family:'Segoe UI','Bahnschrift','Arial',sans-serif;
  display:flex;flex-direction:column;text-align:center;
}
.frame{position:absolute;inset:0;border:4px solid var(--edge);pointer-events:none;z-index:3}

.head{flex:0 0 auto;padding:132px 110px 0;display:flex;flex-direction:column;align-items:center}
.series{
  display:flex;align-items:baseline;justify-content:center;gap:24px;
  font-weight:700;text-transform:uppercase;color:var(--accent);white-space:nowrap;
}
.series .name{font-size:50px;letter-spacing:7px}
.series .dot{font-size:38px;opacity:.6}
.series .num{font-size:40px;letter-spacing:5px;font-weight:600;opacity:.85}
.hairline{width:1180px;height:3px;background:var(--accent);opacity:.35;margin-top:38px}

.main{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 70px}

.title{
  font-family:'Georgia','Cambria','Palatino Linotype',serif;
  font-weight:700;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;
}
.title .word{
  display:block;white-space:nowrap;
  font-size:238px;line-height:1.0;letter-spacing:-4px;color:var(--ink);
}
.title .bar{
  display:block;white-space:nowrap;
  font-size:188px;line-height:1.08;letter-spacing:-2px;
  background:var(--accent);color:var(--cream);
  padding:30px 64px 42px;margin-top:30px;
}

.art{width:1020px;height:670px;flex:0 0 auto;margin-top:118px}
.art svg{display:block;width:1020px;height:670px}

.slab{
  flex:0 0 auto;background:linear-gradient(180deg, var(--ink) 0%, var(--ink2) 100%);
  padding:92px 130px 96px;display:flex;flex-direction:column;align-items:center;
}
.subtitle{font-size:72px;line-height:1.26;font-weight:600;color:var(--cream);max-width:1260px}
.tagline{font-size:48px;line-height:1.34;font-weight:400;color:var(--soft);max-width:1200px;margin-top:26px}
.rule{width:220px;height:10px;background:var(--accent);border-radius:5px;margin:56px 0 52px}
.author{
  font-size:92px;font-weight:700;letter-spacing:14px;text-transform:uppercase;
  color:var(--cream);white-space:nowrap;
}
</style></head>
<body>

  <div class="frame"></div>

  <div class="head">
    <div class="series" data-text="series"><span class="name">Plain Talk Retirement Series</span><span class="dot">&bull;</span><span class="num">Book One</span></div>
    <div class="hairline"></div>
  </div>

  <div class="main">
    <h1 class="title" data-text="title">
      <span class="word">Medicare</span>
      <span class="bar">Made Plain</span>
    </h1>

    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg">
        <g font-family="Georgia, Cambria, serif" font-weight="700" font-size="86" text-anchor="middle">
          <path d="M14 12 H176 L236 61 L176 110 H14 Z" fill="var(--ink)"/>
          <text x="113" y="90" fill="var(--cream)">A</text>
          <path d="M168 128 H330 L390 177 L330 226 H168 L228 177 Z" fill="var(--ink)"/>
          <text x="279" y="206" fill="var(--cream)">B</text>
          <path d="M322 244 H484 L544 293 L484 342 H322 L382 293 Z" fill="var(--accent)"/>
          <text x="433" y="322" fill="var(--cream)">C</text>
          <path d="M476 360 H638 L698 409 L638 458 H476 L536 409 Z" fill="var(--accent)"/>
          <text x="587" y="438" fill="var(--cream)">D</text>
        </g>
      </svg>
    </div>
  </div>

  <div class="slab">
    <p class="subtitle" data-text="subtitle">The 2027 Enrollment Season Guide</p>
    <p class="tagline" data-text="tagline">Parts, Plans, and Deadlines Explained Without the Jargon</p>
    <div class="rule"></div>
    <div class="author" data-text="author">Walter Brennan</div>
  </div>

</body></html>
