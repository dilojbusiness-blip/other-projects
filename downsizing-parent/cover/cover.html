<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Downsizing a Parent cover</title>
<!--
  CARING FOR MOM AND DAD SERIES - shared cover system (Maggie Holloway), Book One.
  Third series grammar in the catalogue, deliberately unlike the other two:
    Family Paperwork (Ruth)      dark forest ground, accent bands top AND bottom, folder motif
    Plain Talk Retirement (Walt) ivory ground, hairline + knockout title bar, dark navy footer slab
    Caring for Mom and Dad       warm oat ground, inset accent frame, solid accent pill at top,
                                 dark cocoa serif title on light, solid two-object motif, no footer slab
  Sibling books copy this file and change ONLY --accent, the motif, and the text.
    Book 1  downsizing-parent   --accent #a84a22  terracotta
    Book 2  dementia-caregiver  --accent (reserve a cooler warm: dusty blue #44708c or heather #6d5580)
  Rules: 1600x2560 canvas, system fonts only, no external URLs, every text element keeps data-text.
-->
<style>
:root{
  --paper:#f4e9d8;
  --paper2:#e8d9c0;
  --cocoa:#3a2a23;
  --cocoa2:#2b1e19;
  --accent:#a84a22;
  --accent2:#d2743c;
  --cream:#fdf8ef;
  --muted:#6a5347;
  --edge:#9aa2a6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:2560px;overflow:hidden}
body{
  background:
    radial-gradient(1500px 1100px at 50% 26%, rgba(255,255,255,.72) 0%, rgba(255,255,255,0) 72%),
    linear-gradient(166deg, var(--paper) 0%, var(--paper) 56%, var(--paper2) 100%);
  color:var(--cocoa);
  font-family:'Segoe UI','Bahnschrift','Arial',sans-serif;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:150px 130px 140px;
}
.edge{position:absolute;inset:0;border:4px solid var(--edge);pointer-events:none;z-index:4}
.frame{position:absolute;inset:72px;border:6px solid var(--accent);opacity:.9;pointer-events:none;z-index:1}
.frame::after{content:"";position:absolute;inset:16px;border:2px solid var(--accent);opacity:.45}

.head{flex:0 0 auto;z-index:2}
.pill{
  display:inline-flex;align-items:baseline;gap:26px;white-space:nowrap;
  background:var(--accent);color:var(--cream);
  padding:30px 60px 34px;border-radius:14px;
}
.pill .name{font-size:48px;font-weight:700;letter-spacing:7px;text-transform:uppercase}
.pill .dot{font-size:34px;opacity:.7}
.pill .num{font-size:40px;font-weight:600;letter-spacing:5px;text-transform:uppercase;opacity:.92}

.main{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;width:100%}

.title{
  font-family:'Georgia','Cambria','Palatino Linotype',serif;
  font-weight:700;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;
}
.title span{
  display:block;white-space:nowrap;
  font-size:200px;line-height:1.04;letter-spacing:-13px;color:var(--cocoa);
}
.title span.alt{color:var(--accent)}

.rule{width:420px;height:12px;background:var(--accent);border-radius:6px;margin:68px 0 60px;z-index:2}

.subtitle{
  font-size:70px;line-height:1.28;font-weight:600;color:var(--muted);
  max-width:1180px;z-index:2;
}

.art{width:1120px;height:489px;flex:0 0 auto;margin-top:96px;z-index:2}
.art svg{display:block;width:1120px;height:489px}

.foot{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;z-index:2}
.byline{font-size:42px;font-weight:600;letter-spacing:12px;text-transform:uppercase;color:var(--accent);margin-bottom:34px}
.author{
  font-family:'Georgia','Cambria','Palatino Linotype',serif;
  font-size:84px;font-weight:700;letter-spacing:4px;
  color:var(--cocoa);white-space:nowrap;
}
</style></head>
<body>

  <div class="edge"></div>
  <div class="frame"></div>

  <div class="head">
    <div class="pill" data-text="series"><span class="name">Caring for Mom and Dad</span><span class="dot">&bull;</span><span class="num">Book One</span></div>
  </div>

  <div class="main">
    <h1 class="title" data-text="title">
      <span>Downsizing</span>
      <span class="alt">a Parent</span>
    </h1>

    <div class="rule"></div>

    <p class="subtitle" data-text="subtitle">The Next Home, the Belongings, and the Family</p>

    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 1120 489" xmlns="http://www.w3.org/2000/svg">
        <!-- the big house they are leaving -->
        <g>
          <polygon points="18,214 248,44 478,214" fill="var(--cocoa)"/>
          <rect x="68" y="208" width="360" height="248" fill="var(--cocoa)"/>
          <rect x="214" y="330" width="68" height="126" fill="var(--paper)"/>
          <rect x="112" y="252" width="62" height="62" fill="var(--paper)"/>
          <rect x="322" y="252" width="62" height="62" fill="var(--paper)"/>
          <rect x="356" y="96" width="46" height="86" fill="var(--cocoa)"/>
        </g>
        <!-- the move -->
        <g fill="var(--accent)">
          <rect x="520" y="316" width="118" height="22"/>
          <polygon points="630,295 694,327 630,359"/>
        </g>
        <!-- the smaller place they are moving to -->
        <g>
          <polygon points="736,320 866,224 996,320" fill="var(--accent)"/>
          <rect x="770" y="314" width="192" height="142" fill="var(--accent)"/>
          <rect x="848" y="372" width="48" height="84" fill="var(--paper)"/>
          <rect x="800" y="342" width="36" height="36" fill="var(--paper)"/>
          <rect x="908" y="342" width="36" height="36" fill="var(--paper)"/>
        </g>
        <rect x="0" y="456" width="1120" height="13" fill="var(--cocoa)"/>
      </svg>
    </div>
  </div>

  <div class="foot">
    <div class="byline" data-text="byline">A Practical, Step-by-Step Guide</div>
    <div class="author" data-text="author">Margaret &ldquo;Maggie&rdquo; Holloway</div>
  </div>

</body></html>
