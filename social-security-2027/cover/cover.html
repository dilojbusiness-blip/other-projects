<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Social Security, Claimed On Purpose cover</title>
<!--
  PLAIN TALK RETIREMENT SERIES - shared cover system (Walt Brennan), Book Two.
  Identical grammar to medicare-2027: ivory ground, accent hairline + knockout title bar,
  geometric lettered motif, dark navy footer slab. Only --accent and the text change.
    Book 1  medicare-2027        --accent #b1392b  brick
    Book 2  social-security-2027 --accent #0e6a58  pine
  Rules: 1600x2560 canvas, system fonts only, no external URLs, every text element keeps data-text.
-->
<style>
:root{
  --accent:#0e6a58;
  --ink:#0f3242;
  --ink2:#0b2733;
  --paper:#f4eee2;
  --paper2:#e9e0ce;
  --cream:#fbf7ef;
  --soft:#a9c6d2;
  --edge:#9aa2a6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:2560px;overflow:hidden}
body{
  background:
    radial-gradient(1400px 1000px at 50% 30%, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 70%),
    linear-gradient(168deg, var(--paper) 0%, var(--paper) 58%, var(--paper2) 100%);
  color:var(--ink);
  font-family:'Segoe UI','Bahnschrift','Arial',sans-serif;
  display:flex;flex-direction:column;text-align:center;
}
.frame{position:absolute;inset:0;border:4px solid var(--edge);pointer-events:none;z-index:3}

.head{flex:0 0 auto;padding:120px 110px 0;display:flex;flex-direction:column;align-items:center}
.series{
  display:flex;align-items:baseline;justify-content:center;gap:24px;
  font-weight:700;text-transform:uppercase;color:var(--accent);white-space:nowrap;
}
.series .name{font-size:50px;letter-spacing:7px}
.series .dot{font-size:38px;opacity:.6}
.series .num{font-size:40px;letter-spacing:5px;font-weight:600;opacity:.85}
.hairline{width:1180px;height:3px;background:var(--accent);opacity:.35;margin-top:36px}

.main{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 70px}

.title{
  font-family:'Georgia','Cambria','Palatino Linotype',serif;
  font-weight:700;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;
}
.title .word{
  display:block;white-space:nowrap;
  font-size:215px;line-height:1.0;letter-spacing:-4px;color:var(--ink);
}
.title .bar{
  display:block;
  background:var(--accent);color:var(--cream);
  padding:28px 62px 38px;margin-top:30px;
}
.title .bar span{
  display:block;white-space:nowrap;
  font-size:170px;line-height:1.06;letter-spacing:-2px;
}

.art{width:1000px;height:557px;flex:0 0 auto;margin-top:90px}
.art svg{display:block;width:1000px;height:557px}

.slab{
  flex:0 0 auto;background:linear-gradient(180deg, var(--ink) 0%, var(--ink2) 100%);
  padding:86px 130px 90px;display:flex;flex-direction:column;align-items:center;
}
.subtitle{font-size:72px;line-height:1.26;font-weight:600;color:var(--cream);max-width:1260px}
.tagline{font-size:48px;line-height:1.34;font-weight:400;color:var(--soft);max-width:1200px;margin-top:26px}
.rule{width:220px;height:10px;background:var(--accent);border-radius:5px;margin:52px 0 48px}
.author{
  font-size:92px;font-weight:700;letter-spacing:14px;text-transform:uppercase;
  color:var(--cream);white-space:nowrap;
}
</style></head>
<body>

  <div class="frame"></div>

  <div class="head">
    <div class="series" data-text="series"><span class="name">Plain Talk Retirement Series</span><span class="dot">&bull;</span><span class="num">Book Two</span></div>
    <div class="hairline"></div>
  </div>

  <div class="main">
    <h1 class="title" data-text="title">
      <span class="word">Social</span>
      <span class="word">Security,</span>
      <span class="bar"><span>Claimed</span><span>On Purpose</span></span>
    </h1>

    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 700 390" xmlns="http://www.w3.org/2000/svg">
        <g font-family="Georgia, Cambria, serif" font-weight="700" font-size="80" text-anchor="middle">
          <rect x="55"  y="211" width="170" height="160" fill="var(--ink)"/>
          <text x="140" y="333" fill="var(--cream)">62</text>
          <rect x="265" y="116" width="170" height="255" fill="var(--ink)"/>
          <text x="350" y="333" fill="var(--cream)">67</text>
          <rect x="475" y="21"  width="170" height="350" fill="var(--accent)"/>
          <text x="560" y="333" fill="var(--cream)">70</text>
        </g>
        <rect x="30" y="371" width="640" height="9" fill="var(--accent)"/>
      </svg>
    </div>
  </div>

  <div class="slab">
    <p class="subtitle" data-text="subtitle">The 2027 Decision Guide</p>
    <p class="tagline" data-text="tagline">Age, Spouse, Survivor, and the Rules That Actually Change Your Check</p>
    <div class="rule"></div>
    <div class="author" data-text="author">Walter Brennan</div>
  </div>

</body></html>
