<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>The FAFSA, Step by Step cover</title>
<!--
  PRIYA RAMAN college-aid title. Sixth cover grammar in the catalogue. It keeps the house DNA
  (Georgia caps title, Segoe UI support type, one hand-drawn solid SVG motif, one accent colour)
  while taking a ground, an accent and a structure none of the five existing lines owns:
    Family Paperwork (Ruth)         dark forest green ground, gold / copper / slate blue
    Plain Talk Retirement (Walt)    ivory ground, brick / pine, navy footer slab
    Caring for Mom and Dad (Maggie) warm oat ground, terracotta / dusty blue, inset frame
    Gray Divorce (Carol)            graphite ground, jade, hairline top + accent footer band
    Health Series (Dana)            chalk ground, ochre, accent title block mid-canvas
    THIS BOOK (Priya)               deep indigo ground #1b2447, accent sky #5ecbdc,
                                    no edge band and no frame: a solid cream FORM CARD
                                    floats in the lower midfield as the one bright artifact
  Rules: 1600x2560 canvas, system fonts only, no external URLs, every text element keeps data-text.
-->
<style>
:root{
  --ground:#1b2447;
  --ground2:#141b36;
  --cream:#f4f1e8;
  --accent:#5ecbdc;
  --accent-ink:#0f2230;
  --soft:#b6c1dd;
  --muted:#8e9cc4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:2560px;overflow:hidden}
body{
  background:
    radial-gradient(1500px 1150px at 50% 20%, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 70%),
    linear-gradient(168deg, var(--ground) 0%, var(--ground) 56%, var(--ground2) 100%);
  color:var(--cream);
  font-family:'Segoe UI','Bahnschrift','Arial',sans-serif;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:132px 110px 124px;
}

.badge{
  flex:0 0 auto;background:var(--accent);color:var(--accent-ink);
  font-size:50px;font-weight:700;letter-spacing:10px;text-indent:10px;
  padding:22px 44px;border-radius:10px;white-space:nowrap;
}

.title{
  flex:0 0 auto;margin-top:76px;
  font-family:'Georgia','Cambria','Palatino Linotype',serif;
  font-weight:700;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;
  padding-bottom:26px; /* Georgia descenders sit below the line box at this size */
}
.title span{
  display:block;white-space:nowrap;
  font-size:232px;line-height:1.02;letter-spacing:-11px;text-indent:11px;
  color:var(--cream);
}
.title span.alt{color:var(--accent)}

.rule{flex:0 0 auto;width:360px;height:14px;background:var(--accent);border-radius:7px;margin:62px 0 54px}

.subtitle{
  flex:0 0 auto;font-size:74px;line-height:1.28;font-weight:600;color:var(--soft);
  max-width:1200px;
}

.art{flex:0 0 auto;width:1040px;height:666px;margin-top:auto}
.art svg{display:block;width:1040px;height:666px}

.tagline{
  flex:0 0 auto;margin-top:auto;margin-bottom:46px;max-width:1180px;
  font-size:54px;line-height:1.3;font-weight:500;color:var(--muted);letter-spacing:2px;
}

.author{
  flex:0 0 auto;
  font-family:'Georgia','Cambria','Palatino Linotype',serif;
  font-size:94px;font-weight:700;letter-spacing:6px;text-indent:6px;
  text-transform:uppercase;color:var(--accent);white-space:nowrap;
}
</style></head>
<body>

  <div class="badge" data-text="badge">2027-2028</div>

  <h1 class="title" data-text="title">
    <span>The FAFSA,</span>
    <span>Step by</span>
    <span class="alt">Step</span>
  </h1>

  <div class="rule"></div>

  <p class="subtitle" data-text="subtitle">A Parent&rsquo;s Plain-English Guide to the 2027-28 Form</p>

  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 1040 666" xmlns="http://www.w3.org/2000/svg">
      <!-- The form itself, worked top to bottom: three boxes done, one still waiting.
           Heavy solid shapes only, so the card survives the 160px thumbnail. -->
      <rect x="0" y="0" width="1040" height="666" rx="20" fill="var(--cream)"/>
      <rect x="84" y="72" width="420" height="54" rx="6" fill="var(--ground)"/>

      <g>
        <rect x="84" y="202" width="88" height="88" rx="10" fill="var(--accent)"/>
        <path d="M 106 248 L 126 268 L 154 224" fill="none" stroke="var(--accent-ink)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="216" y="222" width="740" height="50" rx="6" fill="var(--ground)"/>
      </g>
      <g>
        <rect x="84" y="320" width="88" height="88" rx="10" fill="var(--accent)"/>
        <path d="M 106 366 L 126 386 L 154 342" fill="none" stroke="var(--accent-ink)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="216" y="340" width="640" height="50" rx="6" fill="var(--ground)"/>
      </g>
      <g>
        <rect x="84" y="438" width="88" height="88" rx="10" fill="var(--accent)"/>
        <path d="M 106 484 L 126 504 L 154 460" fill="none" stroke="var(--accent-ink)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="216" y="458" width="700" height="50" rx="6" fill="var(--ground)"/>
      </g>
      <g>
        <rect x="90" y="562" width="76" height="76" rx="8" fill="none" stroke="var(--ground)" stroke-width="12"/>
        <rect x="216" y="576" width="540" height="50" rx="6" fill="#9aa6c4"/>
      </g>
    </svg>
  </div>

  <p class="tagline" data-text="tagline">Accounts, Assets, Awards and Appeals</p>

  <div class="author" data-text="author">Priya Raman</div>

</body></html>
